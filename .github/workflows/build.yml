name: Run Gradle Build
on: [push, pull_request]
jobs:
  gradle:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        name: Setup Java
        with:
          distribution: temurin
          java-version: 21
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Install LWJGL display query tool
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y x11-xserver-utils
      - name: Build and run Forge client checks
        run: ALSOFT_DRIVERS=null xvfb-run -a ./gradlew --no-daemon build runClientChecks -Pfabricmoddingconventions.devClientOptions=/nonexistent
      - uses: actions/upload-artifact@v7
        name: Upload built mod JAR
        with:
          name: mod-jar
          path: build/libs/*.jar